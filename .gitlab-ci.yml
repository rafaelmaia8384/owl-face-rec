image: docker:20.10.17

services:
  - docker:20.10.17-dind

stages:
  - build
  - deploy

variables:
  REGISTRY: "${CI_REGISTRY_IMAGE}"
  IMAGE_TAG: "${CI_COMMIT_REF_SLUG}"
  IMAGE: "${REGISTRY}:${IMAGE_TAG}"

# Build Stage
build:stage:
  stage: build
  script:
    - rm -f .env && touch .env
    - echo "PORT=$STAGE_PORT" >> .env
    - echo "LOG_LEVEL=$STAGE_LOG_LEVEL" >> .env
    - echo "POSTGRES_HOST=$STAGE_POSTGRES_HOST" >> .env
    - echo "POSTGRES_DB=$STAGE_POSTGRES_DB" >> .env
    - echo "POSTGRES_USER=$STAGE_POSTGRES_USER" >> .env
    - echo "POSTGRES_PASSWORD=$STAGE_POSTGRES_PASSWORD" >> .env
    - echo "POSTGRES_PORT=$STAGE_POSTGRES_PORT" >> .env
    - echo "RUSTFACE_MIN_FACE_SIZE=$STAGE_RUSTFACE_MIN_FACE_SIZE" >> .env
    - echo "RUSTFACE_SCORE_THRESH=$STAGE_RUSTFACE_SCORE_THRESH" >> .env
    - echo "RUSTFACE_PYRAMID_SCALE_FACTOR=$STAGE_RUSTFACE_PYRAMID_SCALE_FACTOR" >> .env
    - echo "RUSTFACE_SLIDE_WINDOW_STEP_X=$STAGE_RUSTFACE_SLIDE_WINDOW_STEP_X" >> .env
    - echo "RUSTFACE_SLIDE_WINDOW_STEP_Y=$STAGE_RUSTFACE_SLIDE_WINDOW_STEP_Y" >> .env
    - echo "MINIO_ENDPOINT=$STAGE_MINIO_ENDPOINT" >> .env
    - echo "MINIO_BUCKET=$STAGE_MINIO_BUCKET" >> .env
    - echo "MINIO_ACCESS_KEY=$STAGE_MINIO_ACCESS_KEY" >> .env
    - echo "MINIO_SECRET_KEY=$STAGE_MINIO_SECRET_KEY" >> .env
    - sed -i.bak '/=$/d' .env
    - curl -L -o "models/arcfaceresnet100-8.onnx" "$MODEL_ARCFACERESNET100_8_DOWNLOAD_LINK"
    - curl -L -o "models/seeta_fd_frontal_v1.0.bin" "$MODEL_SEETA_FD_FRONTAL_DOWNLOAD_LINK"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_REF_NAME == "stage"

# Deploy Stage (automático)
deploy:stage:
  stage: deploy
  script:
    - |
      ssh -o StrictHostKeyChecking=no sti@$STAGE_HOST "
        echo '🔑 Logando no Docker Registry...'
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

        echo '⬇️ Puxando a imagem $IMAGE_TAG'
        docker pull $IMAGE_TAG

        echo '🛑 Parando container antigo (se existir)'
        docker stop $(docker ps -aq)
        docker rm $(docker ps -aq)

        echo '▶️ Rodando container novo'
        docker run -d \
          --name owlfacerec \
          -p 3000:3000 \
          $IMAGE_TAG
      "
  needs: ["build:stage"]
  when: always
  rules:
    - if: $CI_COMMIT_REF_NAME == "stage"

# Build Main (release)
build:prod:
  stage: build
  script:
    - rm -f .env && touch .env
    - echo "LOG_LEVEL=$PROD_LOG_LEVEL" >> .env
    - echo "POSTGRES_HOST=$PROD_POSTGRES_HOST" >> .env
    - echo "POSTGRES_DB=$PROD_POSTGRES_DB" >> .env
    - echo "POSTGRES_USER=$PROD_POSTGRES_USER" >> .env
    - echo "POSTGRES_PASSWORD=$PROD_POSTGRES_PASSWORD" >> .env
    - echo "POSTGRES_PORT=$PROD_POSTGRES_PORT" >> .env
    - echo "RUSTFACE_MIN_FACE_SIZE=$PROD_RUSTFACE_MIN_FACE_SIZE" >> .env
    - echo "RUSTFACE_SCORE_THRESH=$PROD_RUSTFACE_SCORE_THRESH" >> .env
    - echo "RUSTFACE_PYRAMID_SCALE_FACTOR=$PROD_RUSTFACE_PYRAMID_SCALE_FACTOR" >> .env
    - echo "RUSTFACE_SLIDE_WINDOW_STEP_X=$PROD_RUSTFACE_SLIDE_WINDOW_STEP_X" >> .env
    - echo "RUSTFACE_SLIDE_WINDOW_STEP_Y=$PROD_RUSTFACE_SLIDE_WINDOW_STEP_Y" >> .env
    - echo "MINIO_ENDPOINT=$PROD_MINIO_ENDPOINT" >> .env
    - echo "MINIO_BUCKET=$PROD_MINIO_BUCKET" >> .env
    - echo "MINIO_ACCESS_KEY=$PROD_MINIO_ACCESS_KEY" >> .env
    - echo "MINIO_SECRET_KEY=$PROD_MINIO_SECRET_KEY" >> .env
    - sed -i.bak '/=$/d' .env
    - curl -L -o "models/arcfaceresnet100-8.onnx" "$MODEL_ARCFACERESNET100_8_DOWNLOAD_LINK"
    - curl -L -o "models/seeta_fd_frontal_v1.0.bin" "$MODEL_SEETA_FD_FRONTAL_DOWNLOAD_LINK"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"

# Deploy Main (manual)
deploy:prod:
  stage: deploy
  script:
    - |
      ssh -o StrictHostKeyChecking=no sti@$PROD_HOST "
        echo '🔑 Logando no Docker Registry...'
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

        echo '⬇️ Puxando a imagem $IMAGE_TAG'
        docker pull $IMAGE_TAG

        echo '🛑 Parando container antigo (se existir)'
        docker stop $(docker ps -aq)
        docker rm $(docker ps -aq)

        echo '▶️ Rodando container novo'
        docker run -d \
          --name owlfacerec \
          -p 3000:3000 \
          $IMAGE_TAG
      "
  needs: ["build:prod"]
  when: manual
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
