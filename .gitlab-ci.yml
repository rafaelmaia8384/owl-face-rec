stages:
  - build
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/cargo

.build-cross-template: &build-cross-template
  stage: build
  image: rust:latest
  before_script:
    - apt-get update
    - apt-get install -y docker.io
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install cross
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cross build --target $TARGET --release
    - mkdir -p artifacts
    - cp target/$TARGET/release/owl-face-rec artifacts/owl-face-rec-$TARGET
  artifacts:
    paths:
      - artifacts/
  only:
    - main

build-amd64-cross:
  <<: *build-cross-template
  variables:
    TARGET: x86_64-unknown-linux-musl

build-arm64-cross:
  <<: *build-cross-template
  variables:
    TARGET: aarch64-unknown-linux-musl

create-multiarch-manifest:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  script:
    - |
      apk add --no-cache docker
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

      # Build e push para amd64
      docker build -t $CI_REGISTRY_IMAGE:amd64 --build-arg TARGET=x86_64-unknown-linux-musl .
      docker push $CI_REGISTRY_IMAGE:amd64

      # Build e push para arm64  
      docker build -t $CI_REGISTRY_IMAGE:arm64 --build-arg TARGET=aarch64-unknown-linux-musl .
      docker push $CI_REGISTRY_IMAGE:arm64

      # Criar manifest multi-arch
      docker manifest create $CI_REGISTRY_IMAGE:latest \
        $CI_REGISTRY_IMAGE:amd64 \
        $CI_REGISTRY_IMAGE:arm64

      docker manifest push $CI_REGISTRY_IMAGE:latest
  only:
    - main
