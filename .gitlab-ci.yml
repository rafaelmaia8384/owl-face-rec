image: docker:20.10.17

services:
  - docker:20.10.17-dind

stages:
  - validate
  - build
  - deploy

variables:
  REGISTRY: "${CI_REGISTRY_IMAGE}"
  IMAGE_TAG: "${CI_COMMIT_REF_SLUG}"
  IMAGE: "${REGISTRY}:${IMAGE_TAG}"
  LATEST_IMAGE: "${REGISTRY}:latest"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUSTUP_HOME: "${CI_PROJECT_DIR}/.rustup"

cache:
  key: rust-cache-${CI_COMMIT_REF_SLUG}
  paths:
    - target/
    - .cargo/
  policy: pull-push

validate_merge:
  stage: validate
  script:
    - |
      echo "🔍 Validando regras de merge..."
      echo "Source: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      echo "Target: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

      if [[ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" == "main" ]]; then
        if [[ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "stage" ]]; then
          echo "❌ ERRO CRÍTICO: Merge para 'main' PERMITIDO APENAS de 'stage'"
          echo "📋 Branch atual: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
          echo "💡 Fluxo correto: feature → stage → main"
          exit 1
        fi
      fi
      echo "✅ Validação de merge concluída com sucesso"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

# Build Stage
build:stage:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
  artifacts:
    paths:
      - target/debug/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_REF_NAME == "stage"

# Deploy Stage (automático)
deploy:stage:
  stage: deploy
  script:
    - echo "Deploying to stage environment..."
    # scp target/debug/your-binary user@stage-server:/app/
  needs: ["build:stage"]
  environment:
    name: stage
    url: https://stage.seuapp.com
  rules:
    - if: $CI_COMMIT_REF_NAME == "stage"

# Build Main (release)
build:prod:
  stage: build
  <<: *setup_rust
  script:
    - echo "OK"
    # - cargo build --release --verbose
    # - ls -lh target/release/
  artifacts:
    paths:
      - target/release/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"

# Deploy Main (manual)
deploy:prod:
  stage: deploy
  script:
    - echo "Deploying to production..."
    # scp target/release/your-binary user@prod-server:/app/
  environment:
    name: production
    url: https://seuapp.com
  needs: ["build:prod"]
  when: manual
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
