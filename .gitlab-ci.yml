build_multi_arch_manual_main:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "0" # Desabilita TLS verification para simplificar
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    # Configuração simplificada do Buildx
    - docker buildx create --use --name multi-arch-builder --driver docker-container --driver-opt network=host
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag "$REGISTRY:$IMAGE_TAG" \
        --tag "$REGISTRY:$IMAGE_TAG_LATEST" \
        --pull \
        --push \
        .
    - echo "Multi-architecture image pushed successfully!"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: manual
